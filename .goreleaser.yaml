# GoReleaser configuration: release binaries for detscore (core module) and
# beaconsim/beaconsrv (lab module), with checksums, SBOMs and a keyless
# Sigstore signature over the checksums. Provenance attestations and the
# container image are produced by .github/workflows/release.yml.
#
# Check locally: goreleaser check && goreleaser release --snapshot --clean --skip=sign,sbom
version: 2
project_name: quic-research

before:
  hooks:
    - go mod verify
    - sh -c "cd lab && go mod verify"

builds:
  - &build
    id: detscore
    main: ./cmd/detscore
    binary: detscore
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/1337-llama/QUIC-Research-and-Defense/internal/version.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build
    id: beaconsim
    dir: lab
    main: ./cmd/beaconsim
    binary: beaconsim
  - <<: *build
    id: beaconsrv
    dir: lab
    main: ./cmd/beaconsrv
    binary: beaconsrv

archives:
  - id: default
    ids: [detscore, beaconsim, beaconsrv]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    output: true

changelog:
  # GitHub's generated notes list merged pull requests by title, which is
  # how changes are described in this repository.
  use: github-native

release:
  prerelease: auto
  footer: |
    ## Verifying this release

    `checksums.txt` is signed with Sigstore (keyless, by this repository's release workflow), and every archive has a SLSA build provenance attestation.

    ```sh
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/1337-llama/QUIC-Research-and-Defense/\.github/workflows/release\.yml@' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    gh attestation verify {{ .ProjectName }}_{{ .Version }}_linux_amd64.tar.gz --repo 1337-llama/QUIC-Research-and-Defense
    ```

    The lab container image is `ghcr.io/1337-llama/quic-research-lab:{{ .Version }}`, signed with cosign and attested the same way.
