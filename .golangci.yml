# golangci-lint v2 configuration. Run with `make lint`.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint       # wrapped-error handling (errors.Is/As, %w)
    - bodyclose       # HTTP response bodies are closed
    - noctx           # HTTP requests carry a context
    - nilerr          # returning nil after checking err != nil
    - contextcheck
    - durationcheck   # multiplying two durations
    - exhaustive      # switch statements over enums cover every case
    - makezero
    - copyloopvar
    - forcetypeassert
    # Security
    - gosec
    # Style and maintainability
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
    - intrange
    - nolintlint      # //nolint directives must be specific and justified
    - gocyclo
    - prealloc
    - predeclared
    - whitespace
    - godot
  settings:
    errcheck:
      check-type-assertions: true
      # Writes to a tabwriter or to stderr cannot usefully be handled; real
      # write errors surface from Flush or from the final write.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        - fieldalignment  # readability of structs matters more here
        - shadow          # shadowing err in inner scopes is idiomatic Go
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 20
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam       # value receivers on small config structs are deliberate
        - rangeValCopy    # record slices are small; value semantics read better
        - unnamedResult
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
        - name: context-as-argument
        - name: early-return
        - name: unexported-return
    nolintlint:
      require-explanation: true
      require-specific: true
    godot:
      scope: declarations
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      # Test helpers and fixtures trade some rigor for readability.
      - path: _test\.go
        linters: [gosec, errcheck, forcetypeassert, gocyclo, prealloc, unparam, noctx, contextcheck]
      # Synthetic-capture builder for tests: integer narrowing is bounded by
      # construction there.
      - path: internal/pcap/pcaptest/
        linters: [gosec]
      # Lab binaries read operator-supplied paths by design.
      - path: (cmd|lab/cmd)/
        text: "G304"
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/1337-llama/QUIC-Research-and-Defense
