version: 2
updates:
  - package-ecosystem: gomod
    directory: /lab
    schedule:
      interval: weekly
    groups:
      quic-go:
        patterns: ["github.com/quic-go/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /lab
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /lab/harness
    schedule:
      interval: weekly
