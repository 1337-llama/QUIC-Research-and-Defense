name: chromium-debug
on:
  push:
    branches: [debug/chromium]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start CDN
        working-directory: lab/harness
        run: |
          mkdir -p out/shared
          export LAB_OUT=$PWD/out LAB_UID=$(id -u) LAB_GID=$(id -g)
          docker compose -f compose.yaml build cdn
          docker compose -f compose.yaml run -d --name cdnx --no-deps cdn beaconsrv -listen :443 -listen-tcp :443 -hosts cdn,172.28.0.20 -cert-out /shared/cdn.pem -spki-out /shared/cdn.spki
          sleep 5; ls -la out/shared; cat out/shared/cdn.spki
          docker logs cdnx 2>&1 | tail
      - name: Probe Chromium
        working-directory: lab/harness
        run: |
          export LAB_OUT=$PWD/out
          net=$(docker network ls --format '{{.Name}}' | grep labnet)
          spki=$(cat out/shared/cdn.spki)
          img=chromedp/headless-shell:stable
          docker pull -q $img
          docker run --rm --entrypoint /headless-shell/headless-shell $img --version || true
          run() { echo "::group::$1"; shift; docker run --rm --network "$net" --shm-size 256m --entrypoint sh $img -c "$*" 2>&1 | grep -v -i -E 'dbus|fontconfig' | tail -60; echo "::endgroup::"; }
          hs="timeout 20 /headless-shell/headless-shell --no-sandbox --user-data-dir=/tmp/p"
          url="'data:text/html,<p>ok</p>'"
          q="--host-resolver-rules='MAP cdn 172.28.0.20' --enable-quic --origin-to-force-quic-on=cdn:443 --ignore-certificate-errors-spki-list=$spki"
          run "Q1 forced quic dump-dom" "timeout 12 /headless-shell/headless-shell --no-sandbox --user-data-dir=/tmp/p --headless --disable-gpu $q --log-net-log=/tmp/n.json --dump-dom https://cdn/; echo exit=\$?; grep -o -E 'QUIC_SESSION[A-Z_]*|\"net_error\":-?[0-9]+|\"quic_error\":[0-9]+|h3' /tmp/n.json | sort | uniq -c | sort -rn | head -25"
          docker stop cdnx >/dev/null; docker logs cdnx 2>&1 | grep -E 'stopped' ; docker start cdnx >/dev/null; sleep 3
          run "Q2 forced quic no dump" "timeout 12 /headless-shell/headless-shell --no-sandbox --user-data-dir=/tmp/p --headless --disable-gpu $q https://cdn/; echo exit=\$?"
          docker stop cdnx >/dev/null; docker logs cdnx 2>&1 | grep -E 'stopped' ; docker start cdnx >/dev/null; sleep 3
          run "T1 tcp" "timeout 12 /headless-shell/headless-shell --no-sandbox --user-data-dir=/tmp/p --headless --disable-gpu --host-resolver-rules='MAP cdn 172.28.0.20' --ignore-certificate-errors-spki-list=$spki https://cdn/; echo exit=\$?"
          docker stop cdnx >/dev/null; docker logs cdnx 2>&1 | grep -E 'stopped'
          docker logs cdnx 2>&1 | tail -20
