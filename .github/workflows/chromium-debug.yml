name: chromium-debug
on:
  push:
    branches: [debug/chromium]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start CDN
        working-directory: lab/harness
        run: |
          mkdir -p out/shared
          export LAB_OUT=$PWD/out LAB_UID=$(id -u) LAB_GID=$(id -g)
          docker compose -f compose.yaml build cdn
          docker compose -f compose.yaml run -d --name cdnx --no-deps cdn beaconsrv -listen :443 -listen-tcp :443 -hosts cdn,172.28.0.20 -cert-out /shared/cdn.pem -spki-out /shared/cdn.spki
          sleep 5; ls -la out/shared; cat out/shared/cdn.spki
          docker logs cdnx 2>&1 | tail
      - name: Probe Chromium
        working-directory: lab/harness
        run: |
          export LAB_OUT=$PWD/out
          net=$(docker network ls --format '{{.Name}}' | grep labnet)
          spki=$(cat out/shared/cdn.spki)
          img=chromedp/headless-shell:stable
          docker pull -q $img
          docker run --rm --entrypoint /headless-shell/headless-shell $img --version || true
          run() { echo "::group::$1"; shift; docker run --rm --network "$net" --shm-size 256m --entrypoint sh $img -c "$*" 2>&1 | grep -v -i -E 'dbus|fontconfig' | tail -60; echo "::endgroup::"; }
          hs="timeout 20 /headless-shell/headless-shell --no-sandbox --user-data-dir=/tmp/p"
          url="'data:text/html,<p>ok</p>'"
          run "A default-flags" "$hs --use-gl=angle --use-angle=swiftshader --dump-dom $url; echo exit=\$?"
          run "B headless disable-gpu" "$hs --headless --disable-gpu --dump-dom $url; echo exit=\$?"
          run "C no-zygote single-process" "$hs --headless --disable-gpu --no-zygote --single-process --dump-dom $url; echo exit=\$?"
          run "D disable-dev-shm crash" "$hs --headless --disable-gpu --disable-dev-shm-usage --disable-crash-reporter --disable-breakpad --dump-dom $url; echo exit=\$?"
          run "E screenshot" "cd /tmp && $hs --headless --disable-gpu --screenshot $url; echo exit=\$?; ls -la /tmp/*.png"
          run "F verbose" "$hs --headless --disable-gpu --enable-logging=stderr --v=1 --dump-dom $url 2>&1 | head -60; echo; echo exit=\$?"
          run "G https forced quic swiftshader" "$hs --use-gl=angle --use-angle=swiftshader --host-resolver-rules='MAP cdn 172.28.0.20' --enable-quic --origin-to-force-quic-on=cdn:443 --ignore-certificate-errors-spki-list=$spki --dump-dom https://cdn/; echo exit=\$?"
          docker logs cdnx 2>&1 | tail -20
