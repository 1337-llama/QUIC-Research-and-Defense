name: Update lab dependencies

# Resolves the lab module's dependencies (go mod tidy) and commits lab/go.mod
# and lab/go.sum back to the branch. It runs automatically when lab/go.mod
# changes on a non-main branch, and can be run by hand from the Actions tab
# once this file is on the default branch.
# Commits pushed with GITHUB_TOKEN do not trigger CI (which also prevents
# loops), so push again or re-run CI afterwards.

on:
  push:
    branches-ignore: [main]
    paths:
      - lab/go.mod
      - .github/workflows/lab-deps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: go mod tidy
        working-directory: lab
        run: go mod tidy && go mod verify
      - name: Commit changes
        run: |
          if git diff --quiet -- lab/go.mod && [ -z "$(git status --porcelain -- lab/go.sum)" ]; then
            echo "lab dependencies already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/go.mod lab/go.sum
          git commit -m "lab: resolve module dependencies (go mod tidy)"
          git push
