name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be built with a Go at least as new as any module it lints
  # (lab/go.mod may require a newer Go than the core module).
  GOLANGCI_LINT_VERSION: v2.12.2
  COVER_MIN: "90"

jobs:
  core-test:
    name: Core tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: Module is tidy and dependency-free
        run: |
          go mod tidy -diff
          test -z "$(go list -m all | tail -n +2)" || { echo "the core module must stay dependency-free"; go list -m all; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage gate
        run: scripts/coverage-gate.sh coverage.out "$COVER_MIN"
      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  core-lint:
    name: Core lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lint with the go.mod toolchain: golangci-lint must be built with a Go
      # at least as new as the one it analyzes.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./internal/profile, target: FuzzLoad}
          - {pkg: ./internal/payload, target: FuzzDecodeBeacon}
          - {pkg: ./internal/zeeklog, target: FuzzRead}
          - {pkg: ./internal/eve, target: FuzzReadAlerts}
          - {pkg: ./internal/pcap, target: FuzzReader}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Fuzz for 60s
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s ${{ matrix.pkg }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/"

  lab:
    name: Lab module (HTTP/3 integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: lab/go.mod
          cache-dependency-path: lab/go.sum
      - name: go.mod and go.sum are committed and tidy
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::lab/go.sum is missing. Run 'make lab-tidy' and commit lab/go.sum."
            go mod tidy && cat go.sum
            exit 1
          fi
          go mod tidy -diff
          go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 -v ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: lab
          args: --config ../.golangci.yml

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "lab"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          work-dir: ${{ matrix.module }}

  detections:
    name: Validate Zeek and Suricata content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep these images in step with lab/harness/compose.yaml, which
      # Dependabot updates.
      - name: Zeek scripts parse
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src zeek/zeek:9.0 \
            zeek -a detections/zeek/quic-hunting.zeek lab/harness/zeek/lab-config.zeek
      - name: Suricata rules load
        run: |
          for rules in detections/suricata/*.rules; do
            echo "::group::$rules"
            docker run --rm -v "$PWD:/src:ro" --entrypoint suricata jasonish/suricata:8.0 \
              -T -S "/src/$rules" -l /tmp --set app-layer.protocols.quic.enabled=yes
            echo "::endgroup::"
          done

  sigma:
    name: Validate Sigma rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install sigma-cli
        run: pip install --upgrade sigma-cli pysigma-backend-splunk pysigma-backend-elasticsearch && sigma version
      - name: Check rules
        run: sigma check detections/sigma
      - name: Convert to Splunk and Elasticsearch
        run: |
          sigma convert -t splunk --without-pipeline detections/sigma
          sigma convert -t lucene --without-pipeline detections/sigma

  harness:
    name: Lab harness static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file is valid
        run: docker compose -f lab/harness/compose.yaml --profile analyze config -q
      - name: Shellcheck
        run: shellcheck lab/harness/run.sh lab/harness/package-exercise.sh lab/harness/chromium/browse.sh scripts/*.sh

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
      - name: Local links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress "**/*.md"
          fail: true

  release-config:
    name: Release config (GoReleaser snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: lab/go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      # Builds every release binary and archive without signing or
      # publishing, so a broken release config fails here, not on a tag.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: Binaries report their version
        run: |
          bin=$(find dist -type f -name detscore -path '*linux_amd64*' | head -1)
          "$bin" version | tee /dev/stderr | grep -q 'SNAPSHOT'
