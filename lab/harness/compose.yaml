# Detection lab: simulated QUIC C2 and benign traffic on an isolated network,
# captured to a pcap and analyzed with Zeek, Suricata and detscore.
#
# Use run.sh rather than calling compose directly; it sequences capture,
# traffic and analysis and checks every step. Requires a Linux Docker host
# (the capture container sniffs the lab bridge from the host namespace).

name: quic-research-lab

x-lab-image: &lab-image
  image: quic-research-lab:local
  build:
    context: ../..
    dockerfile: lab/Dockerfile

x-sim: &sim
  <<: *lab-image
  user: "${LAB_UID:-65532}:${LAB_GID:-65532}"
  depends_on: [c2, c2-tcp, cdn]
  volumes:
    - ${LAB_OUT:-./out}/shared:/shared:ro
    - ${LAB_OUT:-./out}:/out

# Lab servers run as the invoking user so they can publish their
# certificates into the bind-mounted shared directory. (Docker lets
# unprivileged container processes bind port 443.)
x-server: &server
  <<: *lab-image
  user: "${LAB_UID:-65532}:${LAB_GID:-65532}"
  volumes:
    - ${LAB_OUT:-./out}/shared:/shared

services:
  # "C2" lab server: what the malicious profiles beacon to.
  c2:
    <<: *server
    command: [beaconsrv, -listen, ":443", -hosts, "${LAB_C2_NAME:-c2},172.28.0.10", -cert-out, /shared/c2.pem, -log-format, json]
    networks:
      labnet:
        ipv4_address: 172.28.0.10
        aliases: ["${LAB_C2_NAME:-c2}"]

  # A second C2 server that only speaks HTTP/2 over TLS/TCP. To a simulator
  # it looks exactly like a network that blocks UDP/443, so the fallback
  # profile's QUIC attempts fail and it beacons over HTTPS instead.
  c2-tcp:
    <<: *server
    command: [beaconsrv, -listen, "", -listen-tcp, ":443", -hosts, "${LAB_C2TCP_NAME:-c2-tcp},172.28.0.11",
              -cert-out, /shared/c2-tcp.pem, -log-format, json]
    networks:
      labnet:
        ipv4_address: 172.28.0.11
        aliases: ["${LAB_C2TCP_NAME:-c2-tcp}"]

  # "CDN" lab server: the approved destination benign traffic uses. It also
  # publishes its SPKI hash so a real Chromium can trust it.
  cdn:
    <<: *server
    command: [beaconsrv, -listen, ":443", -hosts, "cdn,172.28.0.20", -cert-out, /shared/cdn.pem,
              -spki-out, /shared/cdn.spki, -log-format, json]
    networks:
      labnet: {ipv4_address: 172.28.0.20}

  sim-merlin:
    <<: *sim
    command: [beaconsim, -profile, merlin-like, -target, "${LAB_C2_NAME:-c2}:443", -ca, /shared/c2.pem,
              -duration, "${LAB_DURATION:-6m}", -run-id, merlin, -seed, "${LAB_SEED_MERLIN:-101}",
              -truth, /out/truth-merlin.jsonl, -keylog, /out/keys-merlin.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_MERLIN:-172.28.0.30}"}

  sim-quicagent:
    <<: *sim
    command: [beaconsim, -profile, quicagent-like, -target, "${LAB_C2_NAME:-c2}:443", -ca, /shared/c2.pem,
              -duration, "${LAB_DURATION:-6m}", -run-id, quicagent, -seed, "${LAB_SEED_QUICAGENT:-102}",
              -truth, /out/truth-quicagent.jsonl, -keylog, /out/keys-quicagent.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_QUICAGENT:-172.28.0.31}"}

  # QUIC first, HTTPS over TCP when QUIC fails: what blocking UDP/443 leaves.
  sim-fallback:
    <<: *sim
    command: [beaconsim, -profile, quicagent-like, -target, "${LAB_C2TCP_NAME:-c2-tcp}:443", -ca, /shared/c2-tcp.pem,
              -fallback, -quic-timeout, 3s, -interval, 30s,
              -duration, "${LAB_DURATION:-6m}", -run-id, fallback, -seed, "${LAB_SEED_FALLBACK:-103}",
              -truth, /out/truth-fallback.jsonl, -keylog, /out/keys-fallback.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_FALLBACK:-172.28.0.32}"}

  # Hard case: a handful of widely jittered beacons, too few for the
  # periodicity detector within a short run.
  sim-lowslow:
    <<: *sim
    command: [beaconsim, -profile, low-and-slow, -target, "${LAB_C2_NAME:-c2}:443", -ca, /shared/c2.pem, -interval, 90s,
              -duration, "${LAB_DURATION:-6m}", -run-id, lowslow, -seed, "${LAB_SEED_LOWSLOW:-104}",
              -truth, /out/truth-lowslow.jsonl, -keylog, /out/keys-lowslow.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_LOWSLOW:-172.28.0.33}"}

  # Hard case: periodic beacons on connections replaced before they get
  # long enough for the long-connection detector.
  sim-rotating:
    <<: *sim
    command: [beaconsim, -profile, rotating-session, -target, "${LAB_C2_NAME:-c2}:443", -ca, /shared/c2.pem, -rotate-after, 2m,
              -duration, "${LAB_DURATION:-6m}", -run-id, rotating, -seed, "${LAB_SEED_ROTATING:-105}",
              -truth, /out/truth-rotating.jsonl, -keylog, /out/keys-rotating.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_ROTATING:-172.28.0.34}"}

  bg-browser-1:
    <<: *sim
    command: [beaconsim, -profile, browser-like, -target, "cdn:443", -ca, /shared/cdn.pem,
              -duration, "${LAB_DURATION:-6m}", -run-id, browser-1, -seed, "${LAB_SEED_BROWSER1:-201}",
              -truth, /out/truth-browser-1.jsonl, -keylog, /out/keys-browser-1.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_BROWSER1:-172.28.0.40}"}

  bg-browser-2:
    <<: *sim
    command: [beaconsim, -profile, browser-like, -target, "cdn:443", -ca, /shared/cdn.pem,
              -duration, "${LAB_DURATION:-6m}", -run-id, browser-2, -seed, "${LAB_SEED_BROWSER2:-202}",
              -truth, /out/truth-browser-2.jsonl, -keylog, /out/keys-browser-2.log, -log-format, json]
    networks:
      labnet: {ipv4_address: "${LAB_IP_BROWSER2:-172.28.0.41}"}

  # Real browser background: headless Chromium fetching the CDN page over
  # QUIC at random intervals. Its connections are labeled benign from Zeek's
  # conn.log after the run (the browser writes no ground truth itself).
  bg-chromium:
    image: chromedp/headless-shell:stable
    depends_on: [cdn]
    shm_size: 256m
    entrypoint: [sh, /lab/browse.sh]
    environment:
      LAB_SECONDS: "${LAB_SECONDS:-360}"
    volumes:
      - ${LAB_OUT:-./out}/shared:/shared:ro
      - ./chromium:/lab:ro
    networks:
      labnet: {ipv4_address: "${LAB_IP_CHROMIUM:-172.28.0.50}"}

  # Packet capture of the lab bridge: all UDP, plus TCP/443 for the HTTPS
  # fallback and the browser.
  capture:
    image: nicolaka/netshoot:v0.16
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    command: [tcpdump, -i, qrlab0, -U, -n, -w, /out/lab.pcap, "udp or (tcp and port 443)"]
    volumes:
      - ${LAB_OUT:-./out}:/out

  # ---- Analysis (run on demand by run.sh) ----

  zeek:
    profiles: [analyze]
    image: zeek/zeek:9.0
    working_dir: /out/zeek
    network_mode: none
    command: [zeek, -C, -r, /out/lab.pcap, /detections/zeek/quic-hunting.zeek, /lab/lab-config.zeek, "LogAscii::use_json=T"]
    volumes:
      - ${LAB_OUT:-./out}:/out
      - ../../detections:/detections:ro
      - ./zeek:/lab:ro

  suricata:
    profiles: [analyze]
    image: jasonish/suricata:8.0
    network_mode: none
    entrypoint: [suricata]
    command: [-r, /out/lab.pcap, -S, /detections/suricata/quic.rules, -l, /out/suricata, -k, none,
              --set, app-layer.protocols.quic.enabled=yes,
              --set, app-layer.protocols.quic.ja4-fingerprints=yes,
              --set, app-layer.protocols.tls.ja4-fingerprints=yes]
    volumes:
      - ${LAB_OUT:-./out}:/out
      - ../../detections:/detections:ro

  tools:
    <<: *lab-image
    profiles: [analyze]
    user: "${LAB_UID:-65532}:${LAB_GID:-65532}"
    network_mode: none
    volumes:
      - ${LAB_OUT:-./out}:/out

networks:
  labnet:
    # internal: no route out of the lab. The simulator also refuses non-lab
    # addresses on its own.
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: qrlab0
    ipam:
      config:
        - subnet: 172.28.0.0/24

